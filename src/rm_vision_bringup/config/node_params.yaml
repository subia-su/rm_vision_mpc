/camera_node:
  ros__parameters:
    camera_info_url: package://rm_vision_bringup/config/camera_info.yaml
    exposure_time: 6000
    gain: 8.0
    frame_rate: 46.0
    width: 640
    height: 640
    sensor_width: 1440
    sensor_height: 1080
    # -1 表示在当前传感器范围内自动居中
    offset_x: -1
    offset_y: -1

/serial_driver:
  ros__parameters:
    timestamp_offset: 0.006
    device_name: /dev/ttyACM0
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"

/armor_detector:
  ros__parameters:
    # Enable image diagnostics only while tuning the detector.
    debug: false

    # true: 使用 YOLOv8-OBB(TensorRT)；false: 使用传统 CV 检测器
    # 当前工作机没有 CUDA/TensorRT，默认使用传统 CV；Jetson 上可改回 true。
    use_yolo: false
    yolo.conf_threshold: 0.15
    yolo.nms_threshold: 0.5
    # 3V3: 只识别哨兵(guard) + 步兵(1~5)；留空 [] 则识别全部 18 类
    yolo.target_numbers: ["guard", "1", "2", "3", "4", "5"]

    # OpenCV DNN CPU 可选后端；由 yolo26_cpu_bringup.launch.py 使用
    dnn.backend: openvino_int8
    dnn.conf_threshold: 0.35
    dnn.nms_threshold: 0.5
    dnn.threads: 6

    # PnP geometry and short-horizon temporal gates
    filter.max_reprojection_error_px: 8.0
    filter.min_box_aspect: 1.2
    filter.max_box_aspect: 6.5
    filter.min_depth_m: 0.05
    filter.max_depth_m: 12.0
    filter.temporal_gate_seconds: 0.15
    filter.max_position_jump_m: 1.5
    filter.max_image_jump_px: 220.0
    filter.max_angle_jump_rad: 1.4

    detect_color: 0
    binary_thres: 30

    light.min_ratio: 0.1
    armor.min_light_ratio: 0.8

    classifier_threshold: 0.8
    ignore_classes: ["negative"]

/armor_tracker:
  ros__parameters:
    target_frame: odom
    max_armor_distance: 10.0

    ekf:
      sigma2_q_xyz: 0.05
      sigma2_q_yaw: 5.0
      sigma2_q_r: 80.0

      r_xyz_factor: 4e-4
      r_yaw: 5e-3
      confidence_reference: 0.7
      confidence_r_min_scale: 0.25
      confidence_r_max_scale: 4.0

    tracker:
      max_match_distance: 1.0
      max_match_yaw_diff: 2.0

      tracking_thres: 5
      lost_time_thres: 1.0
